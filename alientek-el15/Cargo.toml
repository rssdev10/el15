[package]
name = "alientek-el15"
# Released on its own (tags `alientek-el15-v*`), independent of the apps' version.
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Unofficial client for the ALIENTEK EL15 DC electronic load over Bluetooth LE: command frames, status parsing, scanning and a connection"
documentation = "https://docs.rs/alientek-el15"
readme = "README.md"
keywords = ["alientek", "el15", "electronic-load", "bluetooth", "ble"]
categories = ["hardware-support"]
include = ["src/**/*.rs", "examples/**/*.rs", "Cargo.toml", "README.md", "CHANGELOG.md", "LICENSE"]

[features]
default = ["ble"]
# Bluetooth LE: scanning, connecting and `Device`. Without it the crate keeps the command
# frames, the checksum and the reply parsers, and needs no Bluetooth stack or async runtime.
ble = ["dep:btleplug", "dep:tokio", "dep:tokio-stream", "dep:futures", "dep:uuid", "dep:tracing"]
# Serialize/Deserialize for `Status`, `Mode`, `Warning` and `FirmwareVersion`.
serde = ["dep:serde"]

[dependencies]
thiserror.workspace = true
serde = { workspace = true, optional = true }
btleplug = { workspace = true, optional = true }
# Only what the library uses; applications bring their own runtime.
tokio = { version = "1", features = ["rt", "sync", "time"], optional = true }
tokio-stream = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[[example]]
name = "status"
required-features = ["ble"]

[package.metadata.docs.rs]
all-features = true
