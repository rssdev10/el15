[package]
name = "alientek-el15"
# Released on its own (tags `alientek-el15-v*`), independent of the apps' version.
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Unofficial client for the ALIENTEK EL15 DC electronic load over Bluetooth LE: command frames, status parsing, scanning and a connection"
documentation = "https://docs.rs/alientek-el15"
readme = "README.md"
keywords = ["alientek", "el15", "electronic-load", "bluetooth", "ble"]
categories = ["hardware-support"]
include = ["src/**/*.rs", "examples/**/*.rs", "Cargo.toml", "README.md", "CHANGELOG.md", "LICENSE"]

[dependencies]
btleplug.workspace = true
# Only what the library uses; applications bring their own runtime.
tokio = { version = "1", features = ["rt", "sync", "time"] }
tokio-stream.workspace = true
futures.workspace = true
uuid.workspace = true
thiserror.workspace = true
tracing.workspace = true
serde = { workspace = true, optional = true }

[features]
default = ["serde"]
serde = ["dep:serde"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[[example]]
name = "status"

[package.metadata.docs.rs]
all-features = true
